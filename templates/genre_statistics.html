<!DOCTYPE html>
<html class="no-js">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>类型统计 | MOVIE HUNTER</title>
    <meta name="description" content=""/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#ffffff"/>
    <link type="text/plain" rel="author"/>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
    <link href="{{ url_for('static', filename='css/my-css.css') }}" rel="stylesheet"/>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <script src="{{ url_for('static', filename='js/jquery-3.2.1.min.js') }}"></script>
    <style>
        .stats-container {
            padding: 20px 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .genre-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .genre-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }
        
        .genre-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #e50914 0%, #ff3d47 100%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .genre-card:hover::before {
            opacity: 1;
        }
        
        .genre-name {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .movie-count {
            font-size: 14px;
            color: #666;
            font-weight: normal;
        }
        
        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .stats-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        
        .stats-label {
            color: #666;
            font-size: 14px;
        }
        
        .stats-value {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }
        
        .avg-rating {
            color: #e50914;
        }
        
        .max-rating {
            color: #27ae60;
        }
        
        .min-rating {
            color: #f39c12;
        }
        
        .rating-bar {
            margin-top: 15px;
            height: 8px;
            background: #f0f0f0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        
        .rating-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b 0%, #e50914 100%);
            border-radius: 4px;
            transition: width 1s ease;
        }
        
        .summary-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }
        
        .summary-title {
            font-size: 24px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .summary-item {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .summary-value {
            font-size: 32px;
            font-weight: bold;
            color: #e50914;
            margin-bottom: 5px;
        }
        
        .summary-label {
            color: #666;
            font-size: 14px;
        }
        
        .top-movies-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }
        
        .modal-content {
            background-color: #fff;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            position: relative;
            animation: modalSlideIn 0.3s ease;
        }
        
        @keyframes modalSlideIn {
            from {
                transform: translateY(-30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .close {
            position: absolute;
            top: 15px;
            right: 25px;
            color: #aaa;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .close:hover {
            color: #e50914;
        }
        
        .modal-title {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }
        
        .top-movies-list {
            list-style: none;
            padding: 0;
        }
        
        .top-movie-item {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .top-movie-item:last-child {
            border-bottom: none;
        }
        
        .movie-info {
            flex: 1;
        }
        
        .movie-title-link {
            color: #0066cc;
            text-decoration: none;
            font-weight: 500;
        }
        
        .movie-title-link:hover {
            text-decoration: underline;
        }
        
        .movie-year {
            color: #666;
            font-size: 14px;
            margin-left: 8px;
        }
        
        .movie-rating {
            color: #e50914;
            font-weight: 600;
            font-size: 18px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-style: italic;
            color: #666;
        }
        
        .no-rated-movies {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body id="root">
<div>
    <div class="my-nav">
        <h1 id="logo"><a href="/">MOVIE HUNTER</a></h1>
        <div id="sub-navigation">
            <ul>
                <li><a href="/">首页</a></li>
                <li><a href="/latest">最新电影</a></li>
                <li><a href="/top-rated">高分电影</a></li>
                <li><a href="/most-commented">热门评论</a></li>
                <li><a href="/genre-statistics">类型统计</a></li>
                <li><a href="/search_page">高级搜索</a></li>
                <li><a href="/add_movie">添加电影</a></li>
                <li id="nav-username"></li>
                <li id="nav-logout"></li>
            </ul>
            <div id="search">
                <label for="search-field">搜索</label>
                <form action="/search" method="get" style="display: inline;">
                    <input type="text" name="q" placeholder="输入搜索内容" id="search-field" title="输入搜索内容" class="blink search-field" />
                    <button type="submit" style="display:none;">搜索</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="ml4-container">
        <div class="frontpage-section-top">
            <div class="label collection-label">电影类型统计</div>
        </div>
        
        <div class="stats-container">
            <div class="summary-section" id="summary-section">
                <h3 class="summary-title">总体统计</h3>
                <div class="summary-grid">
                    <div class="summary-item">
                        <div class="summary-value" id="total-genres">0</div>
                        <div class="summary-label">电影类型数</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="total-movies">0</div>
                        <div class="summary-label">电影总数</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="overall-avg-rating">0.0</div>
                        <div class="summary-label">总体平均评分</div>
                    </div>
                    <div class="summary-item">
                        <div class="summary-value" id="highest-rated-genre">-</div>
                        <div class="summary-label">最高评分类型</div>
                    </div>
                </div>
            </div>
            
            <div class="stats-grid" id="stats-grid">
                <div class="loading">正在加载统计数据...</div>
            </div>
        </div>
    </div>
    
    <div id="topMoviesModal" class="top-movies-modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 class="modal-title" id="modal-title">高分电影</h3>
            <ul class="top-movies-list" id="top-movies-list">
                <div class="loading">正在加载...</div>
            </ul>
        </div>
    </div>
</div>

<script>
var baseUrl = window.location.protocol + "//" + window.location.host + "/";

$(document).ready(function() {
    $.get('/get_session_info', function(data) {
        if (data.loggedIn) {
            $('#nav-username').html('<a href="/user.html?id=' + data.userId + '">欢迎，' + data.username + '</a>');
            $('#nav-logout').html('<a href="/logout">退出</a>');
        } else {
            $('#nav-username').html('<a href="/login">登录</a>');
            $('#nav-logout').html('<a href="/register">注册</a>');
        }
    });
    
    loadGenreStatistics();
});

function loadGenreStatistics() {
    $.getJSON('/api/genre-statistics', function(response) {
        if (response.success) {
            displayStatistics(response.data);
            updateSummary(response.data);
        } else {
            $('#stats-grid').html('<div class="loading">加载数据失败，请刷新页面重试</div>');
        }
    }).fail(function() {
        $('#stats-grid').html('<div class="loading">加载数据失败，请刷新页面重试</div>');
    });
}

function displayStatistics(data) {
    var statsGrid = $('#stats-grid');
    statsGrid.empty();
    
    data.sort(function(a, b) {
        return b.avg_rating - a.avg_rating;
    });
    
    data.forEach(function(stat) {
        var ratingWidth = (stat.avg_rating / 5) * 100;
        
        var card = $('<div>', {
            class: 'genre-card',
            'data-genre': stat.genre_name,
            click: function() {
                showTopMovies(stat.genre_name, stat.genre_chinese);
            }
        });
        
        var html = `
            <div class="genre-name">
                <span>${stat.genre_chinese}</span>
                <span class="movie-count">${stat.movie_count} 部电影</span>
            </div>
            
            <div class="stats-row">
                <span class="stats-label">平均评分</span>
                <span class="stats-value avg-rating">${stat.avg_rating.toFixed(2)}</span>
            </div>
            
            <div class="stats-row">
                <span class="stats-label">最高评分</span>
                <span class="stats-value max-rating">${stat.max_rating.toFixed(1)}</span>
            </div>
            
            <div class="stats-row">
                <span class="stats-label">最低评分</span>
                <span class="stats-value min-rating">${stat.min_rating > 0 ? stat.min_rating.toFixed(1) : '暂无'}</span>
            </div>
            
            <div class="stats-row">
                <span class="stats-label">已评分电影</span>
                <span class="stats-value">${stat.rated_movie_count} 部</span>
            </div>
            
            <div class="rating-bar">
                <div class="rating-fill" style="width: 0%;" data-width="${ratingWidth}%"></div>
            </div>
        `;
        
        card.html(html);
        statsGrid.append(card);
    });
    
    setTimeout(function() {
        $('.rating-fill').each(function() {
            $(this).css('width', $(this).data('width'));
        });
    }, 100);
}

function updateSummary(data) {
    var totalGenres = data.length;
    var totalMovies = data.reduce(function(sum, stat) {
        return sum + stat.movie_count;
    }, 0);
    
    var totalRatedMovies = data.reduce(function(sum, stat) {
        return sum + stat.rated_movie_count;
    }, 0);
    
    var overallAvgRating = 0;
    if (totalRatedMovies > 0) {
        var totalRatingSum = data.reduce(function(sum, stat) {
            return sum + (stat.avg_rating * stat.rated_movie_count);
        }, 0);
        overallAvgRating = totalRatingSum / totalRatedMovies;
    }
    
    var highestRatedGenre = data.length > 0 ? data[0] : null;
    
    // 更新显示
    $('#total-genres').text(totalGenres);
    $('#total-movies').text(totalMovies);
    $('#overall-avg-rating').text(overallAvgRating.toFixed(2));
    
    if (highestRatedGenre) {
        $('#highest-rated-genre').text(highestRatedGenre.genre_chinese);
    }
}

function showTopMovies(genre, genreChinese) {
    var modal = $('#topMoviesModal');
    var modalTitle = $('#modal-title');
    var moviesList = $('#top-movies-list');
    
    modalTitle.text(genreChinese + ' - 高分电影');
    moviesList.html('<div class="loading">正在加载...</div>');
    modal.show();
    
    $.getJSON('/api/top-movies-by-genre/' + genre, function(response) {
        if (response.success && response.data.length > 0) {
            moviesList.empty();
            
            response.data.forEach(function(movie, index) {
                var movieItem = $('<li>', { class: 'top-movie-item' });
                
                var html = `
                    <div class="movie-info">
                        <span>${index + 1}. </span>
                        <a href="/movie.html?id=${movie.id}" class="movie-title-link">${movie.title}</a>
                        <span class="movie-year">(${movie.year > 0 ? movie.year : '未知'})</span>
                    </div>
                    <div class="movie-rating">★ ${movie.rating.toFixed(1)}</div>
                `;
                
                movieItem.html(html);
                moviesList.append(movieItem);
            });
        } else {
            moviesList.html('<div class="no-rated-movies">该类型暂无已评分的电影</div>');
        }
    }).fail(function() {
        moviesList.html('<div class="no-rated-movies">加载失败，请重试</div>');
    });
}

$('.close').click(function() {
    $('#topMoviesModal').hide();
});

$(window).click(function(event) {
    if (event.target.id === 'topMoviesModal') {
        $('#topMoviesModal').hide();
    }
});
</script>
</body>
</html>
