<!DOCTYPE html>
<html class="no-js">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <title>电影详情 | MOVIE HUNTER</title>
    <meta name="description" content=""/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#ffffff"/>
    <link type="text/plain" rel="author"/>
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
    <link href="{{ url_for('static', filename='css/my-css.css') }}" rel="stylesheet"/>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    <script src="{{ url_for('static', filename='js/jquery-3.2.1.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/recsys.js') }}"></script>
    <style>
        .rating-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }
        
        .rating-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }
        
        .rating-stars {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .star {
            font-size: 30px;
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .star:hover,
        .star.active {
            color: #ffad33;
        }
        
        .rating-comment {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
            min-height: 100px;
            font-size: 16px;
            margin-bottom: 15px;
        }
        
        .btn-rate {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-rate:hover {
            background: #c70812;
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.3);
        }
        
        .btn-rate:disabled {
            background: #999;
            cursor: not-allowed;
            opacity: 0.7;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .star.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: none;
        }
        
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .user-rating-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body id="root">
<div>
    <div class="my-nav">
        <h1 id="logo"><a href="/">MOVIE HUNTER</a></h1>
        <div id="navigation">
        </div>
        <div id="sub-navigation">
            <ul>
                <li><a href="/">首页</a></li>
                <li><a href="/latest">最新电影</a></li>
                <li><a href="/top-rated">高分电影</a></li>
                <li><a href="/most-commented">热门评论</a></li>
                <li><a href="/add_movie">添加电影</a></li>
                <li id="nav-username"></li>
                <li id="nav-logout"></li>
            </ul>
            <div id="search">
                <label for="search-field">搜索</label>
                <form action="/search" method="get" style="display: inline;">
                    <input type="text" name="q" placeholder="输入搜索内容" id="search-field" title="输入搜索内容" class="blink search-field" />
                    <button type="submit" style="display:none;">搜索</button>
                </form>
            </div>
        </div>
    </div>
    <div class="ml4-container" style="min-height: 920px;">
        <div id="main-container">
            <div class="frontpage" id="moviePage">
                <div id="moviePanel" class="frontpage-section-top">
                </div>
                
                <!-- 评分区域 -->
                <div class="rating-section" id="ratingSection" style="display:none;">
                    <h3 class="rating-title">给这部电影评分</h3>
                    <div id="alert-message" class="alert"></div>
                    <div id="user-rating-info" class="user-rating-info" style="display:none;"></div>
                    <div class="rating-stars" id="rating-stars">
                        <div class="star-container" data-star="1">
                            <span class="star-half" data-rating="0.5">★</span>
                            <span class="star-full" data-rating="1">★</span>
                        </div>
                        <div class="star-container" data-star="2">
                            <span class="star-half" data-rating="1.5">★</span>
                            <span class="star-full" data-rating="2">★</span>
                        </div>
                        <div class="star-container" data-star="3">
                            <span class="star-half" data-rating="2.5">★</span>
                            <span class="star-full" data-rating="3">★</span>
                        </div>
                        <div class="star-container" data-star="4">
                            <span class="star-half" data-rating="3.5">★</span>
                            <span class="star-full" data-rating="4">★</span>
                        </div>
                        <div class="star-container" data-star="5">
                            <span class="star-half" data-rating="4.5">★</span>
                            <span class="star-full" data-rating="5">★</span>
                        </div>
                        <span class="rating-value" id="rating-value">0.0</span>
                    </div>
                    <textarea class="rating-comment" id="rating-comment" placeholder="写下你的评价（选填）..."></textarea>
                    <button class="btn-rate" id="btn-submit-rating">提交评分</button>
                </div>
                
                <div class="frontpage-section-top">
                    <div class="label collection-label">所有评价</div>
                </div>
                <div id="movieRatings" class="collection-panel">
                    <div class="ratings-loading">正在加载评价...</div>
                </div>
                <div id="ratingsPagination" class="pagination">
                </div>
            </div>
            <div class="frontpage" id="recPage">
                <div class="frontpage-section-top">
                    <div class="label collection-label">相似电影</div>
                </div>
                <div id="similarMovies" class="collection-panel">
                </div>
            </div>
        </div>
    </div>
</div>
</body>

<script type="text/javascript">
var baseUrl = window.location.protocol + "//" + window.location.host + "/";
var movieId = getUrlParameter('id');
var model = getUrlParameter('model');
var selectedRating = 0;
var isLoggedIn = false;
var hasUserRated = false;  // 添加标记

// 检查登录状态
$.get('/get_session_info', function(data) {
    isLoggedIn = data.loggedIn;
    if (data.loggedIn) {
        $('#nav-username').html('<a href="/user.html?id=' + data.userId + '">欢迎，' + data.username + '</a>');
        $('#nav-logout').html('<a href="/logout">退出</a>');
        $('#ratingSection').show();
        
        // 检查用户是否已经评分
        checkUserRating();
    } else {
        $('#nav-username').html('<a href="/login">登录</a>');
        $('#nav-logout').html('<a href="/register">注册</a>');
        $('#ratingSection').html('<div class="alert alert-info" style="display:block;">请<a href="/login">登录</a>后评分</div>');
        $('#ratingSection').show();
    }
});

// 获取电影信息
$.getJSON(baseUrl + 'getmovie?id=' + movieId, function (data) {
    showMovieDetails(data, '#moviePanel');
});

// 获取相似电影
$.getJSON(baseUrl + 'getsimilarmovie?movieId=' + movieId + '&size=12&model=' + model, function (data) {
    showMovies(data, '#similarMovies');
});

// 加载电影评分（初始加载第一页）
showAllMovieRatings(movieId, 1);

// 评分功能
$('.star-half, .star-full').click(function() {
    if (!isLoggedIn) return;
    
    selectedRating = parseFloat($(this).data('rating'));
    updateStarDisplay(selectedRating);
    $('#rating-value').text(selectedRating.toFixed(1));
});

// 星星悬停效果
$('#rating-stars').on('mouseover', '.star-half, .star-full', function() {
    if (!isLoggedIn) return;
    var rating = parseFloat($(this).data('rating'));
    updateStarDisplay(rating);
    $('#rating-value').text(rating.toFixed(1));
}).on('mouseout', function() {
    if (!isLoggedIn) return;
    updateStarDisplay(selectedRating);
    $('#rating-value').text(selectedRating.toFixed(1));
});

// 更新星星显示
function updateStarDisplay(rating) {
    $('.star-half, .star-full').removeClass('active');
    
    var fullStars = Math.floor(rating);
    var hasHalfStar = (rating % 1) !== 0;
    
    // 填充完整的星星
    for (var i = 1; i <= fullStars; i++) {
        $('.star-container[data-star="' + i + '"] .star-full').addClass('active');
        $('.star-container[data-star="' + i + '"] .star-half').addClass('active');
    }
    
    // 填充半星
    if (hasHalfStar) {
        $('.star-container[data-star="' + (fullStars + 1) + '"] .star-half').addClass('active');
    }
}

// 提交评分
$('#btn-submit-rating').click(function() {
    var btn = $(this);
    var originalText = btn.text();
    
    // 防止重复提交
    if (btn.prop('disabled')) {
        return;
    }
    
    if (selectedRating === 0) {
        showMessage('请先选择评分', 'error');
        return;
    }
    
    var comment = $('#rating-comment').val();
    
    // 禁用按钮和星星
    btn.prop('disabled', true);
    btn.html('<span class="loading-spinner"></span>正在提交...');
    $('.star-half, .star-full').css('pointer-events', 'none');
    $('#rating-comment').prop('disabled', true);
    
    $.ajax({
        url: '/rate_movie',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            movieId: movieId,
            rating: selectedRating,
            comment: comment
        }),
        success: function(response) {
            if (response.success) {
                btn.html('<span class="loading-spinner"></span>提交成功！');
                showMessage(response.message, 'success');
                
                // 立即更新状态标记
                hasUserRated = true;
                
                // 1秒后更新UI
                setTimeout(function() {
                    btn.prop('disabled', false);
                    btn.text('更新评分');
                    $('.star-half, .star-full').css('pointer-events', 'auto');
                    $('#rating-comment').prop('disabled', false);
                    
                    // 显示已评分信息
                    $('#user-rating-info').html('您已经给这部电影评了 ' + selectedRating.toFixed(1) + ' 分，可以修改您的评分。');
                    $('#user-rating-info').show();
                }, 1000);
                
                // 重新加载评分列表
                showAllMovieRatings(movieId, 1);
                
                // 刷新电影信息（更新平均分）
                $.getJSON(baseUrl + 'getmovie?id=' + movieId, function (data) {
                    showMovieDetails(data, '#moviePanel');
                });
            } else {
                showMessage(response.message, 'error');
                // 恢复按钮
                btn.prop('disabled', false);
                btn.text(originalText);
                $('.star-half, .star-full').css('pointer-events', 'auto');
                $('#rating-comment').prop('disabled', false);
            }
        },
        error: function() {
            showMessage('评分失败，请重试', 'error');
            // 恢复按钮
            btn.prop('disabled', false);
            btn.text(originalText);
            $('.star-half, .star-full').css('pointer-events', 'auto');
            $('#rating-comment').prop('disabled', false);
        }
    });
});

// 改进的检查用户是否已评分函数
function checkUserRating() {
    $.getJSON(baseUrl + 'get_user_rating?movieId=' + movieId, function(data) {
        if (data.hasRated) {
            hasUserRated = true;
            selectedRating = data.rating;
            $('#rating-comment').val(data.comment || '');
            
            // 显示已评分状态
            updateStarDisplay(selectedRating);
            $('#rating-value').text(selectedRating.toFixed(1));
            
            $('#user-rating-info').html('您已经给这部电影评了 ' + data.rating.toFixed(1) + ' 分，可以修改您的评分。');
            $('#user-rating-info').show();
            $('#btn-submit-rating').text('更新评分');
        } else {
            hasUserRated = false;
            $('#btn-submit-rating').text('提交评分');
            $('#user-rating-info').hide();
        }
    }).fail(function() {
        console.error('检查用户评分失败');
    });
}

function showMessage(message, type) {
    var alertDiv = $('#alert-message');
    alertDiv.removeClass('alert-success alert-error alert-info');
    alertDiv.addClass('alert-' + type);
    alertDiv.text(message);
    alertDiv.show();
    
    setTimeout(function() {
        alertDiv.fadeOut();
    }, 3000);
}
</script>
</html>
